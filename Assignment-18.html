<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
        }

        .container {
            width: 80%;
            margin: auto;
            border: 1px solid #c5d8c5;
            padding: 8px;
        }

        header {
            background-color: #202777;
            color: white;
            text-align: center;
            padding: 15px;
            width: 80%;
            margin: auto;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 65%;
            margin: auto;
            border-collapse: collapse;
        }

        caption {
            margin-bottom: 5px;
        }

        th, td {
            border: 1px solid #aaa;
            padding: 4px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: #e5e7f2;
            text-align: center;
        }

        form {
            width: 65%;
            margin: 10px auto;
        }

        input, select {
            margin-bottom: 10px;
        }

        textarea {
            width: 95%;
            height: 40px;
        }

        footer {
            background-color: #202777;
            color: white;
            text-align: center;
            padding: 5px;
            width: 80%;
            margin: auto;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <h2>Courses and Fees</h2>

    <table>
        <caption>Available Courses</caption>

        <tr>
            <th>Course</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>

        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
        </tr>

        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
        </tr>
    </table>

    <form action="submit.php" method="POST">

        <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required>
            <br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required>
            <br>

            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <option value="B.Tech CSE">B.Tech CSE</option>
                <option value="BCA">BCA</option>
            </select>
            <br><br>

            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" required></textarea>
            <br><br>

            <input type="submit" value="Apply">

        </fieldset>

    </form>

    <footer>
        © 2026 ABC College
    </footer>

</div>

</body>
</html>
