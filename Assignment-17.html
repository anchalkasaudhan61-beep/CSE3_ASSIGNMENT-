<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <form method="POST" action="submit.php">

        <input type="text" placeholder="Full name" required>
        <br><br>

        <input type="email" placeholder="you@college.edu" required>
        <br><br>

        <input type="tel" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
        <br><br>

        <input type="password" placeholder="Min 6 characters" minlength="6" required>
        <br><br>

        <input type="number" placeholder="Age (17-30)" min="18" max="30" required>
        <br><br>

        <input type="submit" value="Register">

    </form>

</body>
</html>
